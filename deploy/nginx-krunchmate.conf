# KrunchMate — Nginx reverse-proxy template for Hostinger VPS.
# Copy to /etc/nginx/sites-available/krunchmate.conf, then symlink into
# /etc/nginx/sites-enabled/ and reload:  systemctl reload nginx
#
# Replace <YOUR_DOMAIN> with your actual domain, e.g. krunchmate.com.
# Uses certbot for TLS; run `certbot --nginx -d krunchmate.com -d www.krunchmate.com`
# after DNS is pointed at your VPS.

server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN> www.<YOUR_DOMAIN>;
    # certbot will insert the 443 block + redirect on first issue.

    # --- Compression -------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve GLB models with the correct MIME type + long-lived cache.
    location ~* \.glb$ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Type "model/gltf-binary";
    }

    # Static asset cache — hashed CRA build filenames.
    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- API — proxied to the FastAPI backend on 127.0.0.1:8001 ------------
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Frontend SPA ------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reject requests for hidden files.
    location ~ /\.(?!well-known) {
        deny all;
    }

    client_max_body_size 20M;
}
